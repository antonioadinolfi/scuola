<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Test Online - Prof. Antonio Adinolfi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary-color: #0d1b2e;
      --danger-color: #b33d3d;
      --bg-color: #f7f4ef;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden; /* Impedisce lo scroll della pagina esterna */
      background-color: var(--bg-color);
      /* Protezione: impedisce la selezione del testo */
      user-select: none;
      -webkit-user-select: none;
    }

    /* Barra superiore in stile classe.html */
    .top-bar {
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      justify-content: space-between;
      position: relative;
      z-index: 1000;
    }

    .info-test {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-text {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1.1rem;
    }

    .btn-exit {
      padding: 8px 16px;
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-exit:hover { opacity: 0.9; }

    /* Contenitore per il Test PanQuiz */
    #test-container {
      height: calc(100vh - 60px); /* Sottrae l'altezza della top-bar */
      width: 100%;
      border: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="design-system.css">
<meta name="theme-color" content="#0b3b75"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
</head>

<body oncontextmenu="return false;" onpaste="return false;">

  <div class="top-bar">
    <div class="info-test">
      <span class="logo-text">📝 Verifica Online - Informatica</span>
      <span id="nomeDisplay" style="color: #666; font-size: 0.9rem;"></span>
    </div>
    <button class="btn-exit" onclick="confermaUscita()">Esci dal Test</button>
  </div>

  <div id="test-container">
    <iframe 
      src="https://take.panquiz.com/3539-0726-8880" 
      allow="autoplay; camera; microphone; fullscreen"
      title="PanQuiz Test">
    </iframe>
  </div>

  <script>
    // Recupera il nome se salvato in precedenza
    document.addEventListener("DOMContentLoaded", () => {
        const nome = localStorage.getItem("nomeStudente") || "";
        if (nome) {
            document.getElementById("nomeDisplay").textContent = "| Studente: " + nome;
        }
    });

    // Blocca i tasti di scelta rapida (Copia/Incolla/S)
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && ['c','v','x','s','u'].includes(e.key.toLowerCase())) {
          e.preventDefault();
          alert("Attenzione: Azione non consentita durante il test.");
      }
    });

   function confermaUscita() {
      if (confirm("Sei sicuro di voler uscire? Assicurati di aver inviato il test su PanQuiz prima di chiudere.")) {
          LSCAuth.logout();
      }
    }
  </script>

  <script src="pwa-register.js"></script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="auth-enterprise.js"></script>
  <script>
    LSCAuth.requireAuth({ loginUrl: "login.html" });
  </script>
</body>
</html>
