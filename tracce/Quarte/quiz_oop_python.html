<style>

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

  /* codice */
  .code { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; overflow-x: auto; font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; font-size: 14px; padding: 8px 0; }

  .code li { display: flex; padding: 0 12px 0 0; white-space: pre; border-left: 4px solid transparent; }
  .code li .ln { display: inline-block; width: 3ch; text-align: right; margin-right: 14px; color: var(--com); user-select: none; flex-shrink: 0; }

  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt-body { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; background: #fff; }
  .opt-key { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .opt pre { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .opt input:checked + .opt-body { border-color: var(--accent); background: #eef3fd; }
  .opt input:checked + .opt-body .opt-key { background: var(--accent); color: #fff; }

  /* moduli e messaggi */
  label.campo { display: block; font-weight: 600; margin-top: 12px; }
  input[type=text] { font: inherit; min-height: 44px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 8px; width: 140px; text-transform: uppercase; }
  .err { color: var(--ko); font-weight: 600; min-height: 1.5em; margin: 8px 0 0; }
  .avviso { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); margin-top: 12px; }
  .utente { padding: 10px 12px; border-radius: 8px; background: var(--ok-bg); margin-top: 12px; }
  code.inline { font-family: ui-monospace, Consolas, monospace; background: #eceff4; padding: 0 4px; border-radius: 4px; font-size: .92em; }
  .kbd-help { font-size: .85rem; color: var(--muted); }
  kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: #fff; font-size: .85em; }
  #gsi-btn { margin-top: 12px; min-height: 44px; }

  /* riepilogo ed esito */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; min-height: 0; font-weight: 600; }
  .vuota { color: var(--ko); font-weight: 600; }
  .punteggio { font-size: 2.4rem; font-weight: 800; margin: 4px 0; }
  .esito { display: inline-block; padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 1.2rem; }
  .esito.ok { background: var(--ok-bg); color: var(--ok); } .esito.ko { background: var(--ko-bg); color: var(--ko); }
  .ripasso { padding: 10px 12px; border-left: 4px solid var(--accent); background: #eef3fd; border-radius: 0 8px 8px 0; margin: 12px 0; }
  .ripasso a { color: var(--accent); font-weight: 700; }
  .timer-bar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 1rem; }
  .timer-bar[hidden] { display: none; }
  .timer-bar strong { font-variant-numeric: tabular-nums; font-size: 1.15rem; }
  .timer-bar.poco { background: var(--ko-bg); color: var(--ko); border-bottom-color: var(--ko); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .conferma { border: 2px solid var(--accent); border-radius: 8px; padding: 12px; margin-top: 12px; background: #f6f8fe; }

</head>

  "codice": [
   "class Conto:",
   "    def __init__(self):",
   "        self.saldo = 100",
   "",
   "    def commissione(self):",

 },
 {

 },
 {

<script>
/* Configurazione: appsScriptUrl è l'URL /exec della web app Apps Script del docente
   (vedi quiz_oop_apps_script/README.md). Finché è vuoto la consegna non è attiva. */
window.QUIZ_OOP_CONFIG = Object.assign({
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbwOagsCVY0UDKEbQCJeK4E47JyaDtYvoelv4oHYt8OMH4RuUoFpBEO3wYAEdhSd1Cap/exec",
  clientId: "1011752872320-713mjtge9ofhtnclhjfvdoc2h2q2uelv.apps.googleusercontent.com",
  dominio: "lscortese.com",
  quizId: "oop-quarta-v2",
  soglia: 0.7,
  durataMinuti: 45
}, window.QUIZ_OOP_CONFIG || {});

<script>
(function () {
  "use strict";
  const CFG = window.QUIZ_OOP_CONFIG;
  const CASI = JSON.parse(document.getElementById("dati-casi").textContent);
  const N = CASI.length;
  const MIN_OK = Math.ceil(CFG.soglia * N);
  const app = document.getElementById("app");

  const S = {
    fase: "inizio", idx: 0, scelte: new Array(N).fill(null),
    token: null, utente: null, classe: "", inizio: null,
    consegnaId: null, confermaAperta: false, risultato: null,
    scadenza: 0, scaduto: false, timerId: null, annunciati: {}
  };

  // ---------- utilità ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const KW = new Set(["class","def","return","if","else","elif","for","in","pass","while","import","from","and","or","not","is","None","True","False","lambda","with","as"]);
  const BI = new Set(["print","super","len","range","str","int"]);
  const TOK = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(@[\w.]+)|\b(\d+)\b|\b([A-Za-z_]\w*)\b/g;
  function evidenzia(riga) {
    let out = "", last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(riga)) !== null) {
      out += esc(riga.slice(last, m.index));
      const t = esc(m[0]);
      if (m[1]) out += `<span class="com">${t}</span>`;
      else if (m[2]) out += `<span class="str">${t}</span>`;
      else if (m[3]) out += `<span class="dec">${t}</span>`;
      else if (m[4]) out += `<span class="num">${t}</span>`;
      else if (KW.has(m[5])) out += `<span class="kw">${t}</span>`;
      else if (BI.has(m[5])) out += `<span class="bi">${t}</span>`;
      else if (m[5] === "self") out += `<span class="self">${t}</span>`;
      else out += t;
      last = TOK.lastIndex;
    }
    return out + esc(riga.slice(last));
  }
  const badge = tema => `<span class="badge t-${tema}">${tema[0].toUpperCase() + tema.slice(1)}</span>`;
  const date = () => S.scelte.filter(x => x !== null).length;
  function nuovoId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function decodificaJwt(tok) {
    try {
      const b = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const json = decodeURIComponent(atob(b).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
      return JSON.parse(json);
    } catch (e) { return null; }
  }

  // ---------- accesso Google (Google Identity Services) ----------
  let gsiPronto = false, dopoAccesso = null;
  function caricaGsi(cb) {
    if (window.google && google.accounts && google.accounts.id) return cb();
    if (!document.getElementById("gsi-script")) {
      const s = document.createElement("script");
      s.id = "gsi-script"; s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onerror = () => mostraErroreAccesso("Impossibile caricare l'accesso Google. Controlla la connessione e ricarica la pagina.");
      document.head.appendChild(s);
    }
    const t0 = Date.now();
    (function attendi() {
      if (window.google && google.accounts && google.accounts.id) return cb();
      if (Date.now() - t0 > 15000) return mostraErroreAccesso("L'accesso Google non risponde. Ricarica la pagina.");
      setTimeout(attendi, 100);
    })();
  }
  function inizializzaGsi() {
    if (gsiPronto) return;
    google.accounts.id.initialize({ client_id: CFG.clientId, callback: credenziale, auto_select: false, cancel_on_tap_outside: false });
    gsiPronto = true;
  }
  function mostraPulsanteGoogle(idContenitore) {
    caricaGsi(() => {
      inizializzaGsi();
      const el = document.getElementById(idContenitore);
      if (el) google.accounts.id.renderButton(el, { type: "standard", theme: "outline", size: "large", text: "signin_with", shape: "rectangular" });
    });
  }
  function mostraErroreAccesso(msg) {
    const e = document.getElementById("err-accesso");
    if (e) e.textContent = msg;
  }
  function credenziale(resp) {
    const p = decodificaJwt(resp && resp.credential);
    if (!p || !p.email) return mostraErroreAccesso("Accesso non riuscito: riprova.");
    if (!String(p.email).toLowerCase().endsWith("@" + CFG.dominio)) {
      return mostraErroreAccesso(`Usa l'account della scuola (@${CFG.dominio}): ${p.email} non è ammesso.`);
    }
    S.token = resp.credential;
    S.scadenzaToken = Number(p.exp || 0) * 1000;
    S.utente = { email: p.email, nome: p.given_name || "", cognome: p.family_name || "", completo: p.name || p.email };
    if (typeof dopoAccesso === "function") { const f = dopoAccesso; dopoAccesso = null; f(); }
    else if (S.fase === "inizio") schermataInizio();
  }

  // ---------- schermata iniziale ----------
  function schermataInizio() {
    S.fase = "inizio";
    const loggato = !!S.utente;
    app.innerHTML = `
      <div class="card">
        <h1>Quiz OOP in Python – Classe quarta</h1>
        <p class="muted">${N} casi su incapsulamento, ereditarietà e polimorfismo, in ordine di difficoltà crescente (base, intermedio, avanzato).</p>
        <ul>
          <li>Per ogni caso leggi il codice e scegli che cosa stampa <strong>esattamente</strong>.</li>
          <li>Puoi muoverti tra le domande e cambiare le risposte fino alla <strong>consegna finale</strong>.</li>
          <li>Il test è <strong>superato</strong> con almeno <strong>${MIN_OK} risposte esatte su ${N}</strong> (${Math.round(CFG.soglia * 100)}%). Le domande senza risposta valgono come errate.</li>
          <li>Se un'opzione contiene <code class="inline">Errore: NomeEccezione</code>, il programma stampa le righe precedenti e poi si ferma con quell'errore.</li>
          <li>Hai <strong>${CFG.durataMinuti} minuti</strong> dal momento in cui premi «Inizia il quiz». Allo scadere del tempo le risposte vengono <strong>bloccate e consegnate automaticamente</strong>, così come sono.</li>
          <li>Alla consegna il risultato viene inviato al docente con il tuo nome e la tua email della scuola.</li>
        </ul>
        <div class="ripasso"><strong>Prima di iniziare</strong> ripassa la teoria che serve per il quiz:
          <a href="teoria_oop_python.html" id="link-teoria">Ripasso: classi, incapsulamento, ereditarietà e polimorfismo</a></div>
        <p class="kbd-help">Tastiera: <kbd>1</kbd>–<kbd>4</kbd> scegli · <kbd>←</kbd> <kbd>→</kbd> domanda precedente/successiva · <kbd>Invio</kbd> successiva</p>
      </div>
      <div class="card">
        <h2>1. Accedi con l'account della scuola</h2>
        ${loggato
          ? `<div class="utente" id="utente">Accesso effettuato: <strong>${esc(S.utente.completo)}</strong> (${esc(S.utente.email)})</div>`
          : `<p>Per svolgere il quiz devi accedere con il tuo account <strong>@${esc(CFG.dominio)}</strong>.</p><div id="gsi-btn"></div>`}
        <p class="err" id="err-accesso" role="alert"></p>
        <h2 style="margin-top:14px">2. Indica la tua classe</h2>
        <label class="campo" for="classe">Classe (es. 4B)</label>
        <input type="text" id="classe" maxlength="3" autocomplete="off" value="${esc(S.classe)}" ${loggato ? "" : "disabled"}>
        <p class="err" id="err-classe" role="alert"></p>
        ${CFG.appsScriptUrl ? "" : `<div class="avviso">La consegna online non è ancora attiva: puoi svolgere il quiz, ma non potrai consegnarlo. Avvisa il docente.</div>`}
        <div class="actions"><button id="btn-inizia" ${loggato ? "" : "disabled"}>Inizia il quiz</button></div>
      </div>`;
    if (!loggato) mostraPulsanteGoogle("gsi-btn");
    const inp = document.getElementById("classe");
    document.getElementById("btn-inizia").addEventListener("click", avvia);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); avvia(); } });
    if (loggato) inp.focus();
  }

  function avvia() {
    if (!S.utente) { mostraErroreAccesso("Prima accedi con l'account della scuola."); return; }
    const v = document.getElementById("classe").value.trim().toUpperCase().replace(/\s+/g, "");
    if (!/^4[A-Z]{1,2}$/.test(v)) {
      document.getElementById("err-classe").textContent = "Scrivi la tua classe quarta: un 4 seguito dalla sezione, per esempio 4B.";
      document.getElementById("classe").focus();
      return;
    }
    // Il token Google dura circa un'ora: deve coprire tutto il tempo del test.
    if (S.scadenzaToken && S.scadenzaToken - Date.now() < (CFG.durataMinuti + 2) * 60000) {
      S.token = null; S.utente = null;
      schermataInizio();
      mostraErroreAccesso("Il tuo accesso è troppo vecchio per coprire tutto il test: accedi di nuovo e poi premi «Inizia il quiz».");
      return;
    }
    S.classe = v; S.idx = 0; S.scelte = new Array(N).fill(null);
    S.inizio = new Date(); S.consegnaId = nuovoId(); S.confermaAperta = false;
    S.scaduto = false; S.annunciati = {};
    S.scadenza = Date.now() + CFG.durataMinuti * 60000;
    avviaTimer();
    mostraCaso();
  }

  // ---------- timer ----------
  function avviaTimer() {
    clearInterval(S.timerId);
    document.getElementById("timer-bar").hidden = false;
    aggiornaTimer();
    S.timerId = setInterval(aggiornaTimer, 1000);
  }
  function fermaTimer(nascondi) {
    clearInterval(S.timerId); S.timerId = null;
    if (nascondi) document.getElementById("timer-bar").hidden = true;
  }
  function aggiornaTimer() {
    const resto = S.scadenza - Date.now();
    if (resto <= 0) { tempoScaduto(); return; }
    const sec = Math.ceil(resto / 1000), mm = Math.floor(sec / 60), ss = sec % 60;
    document.getElementById("timer").textContent = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
    document.getElementById("timer-bar").classList.toggle("poco", resto <= 5 * 60000);
    [10, 5, 1].forEach(m => {
      if (resto <= m * 60000 && !S.annunciati[m] && CFG.durataMinuti > m) {
        S.annunciati[m] = true;
        document.getElementById("annuncio-tempo").textContent = m === 1 ? "Manca 1 minuto alla consegna automatica." : `Mancano ${m} minuti alla consegna automatica.`;
      }
    });
  }
  function tempoScaduto() {
    if (S.scaduto) return;
    S.scaduto = true;
    fermaTimer(false);
    document.getElementById("timer").textContent = "00:00";
    document.getElementById("timer-bar").classList.add("poco");
    document.getElementById("annuncio-tempo").textContent = "Tempo scaduto: il test viene consegnato.";
    if (S.fase === "domanda" || S.fase === "riepilogo") {
      if (CFG.appsScriptUrl) consegna();
      else schermataBloccata();
    } else if (S.fase === "errore") {
      const b = document.getElementById("btn-indietro");
      if (b) b.remove();
    }
  }
  function schermataBloccata() {
    S.fase = "bloccato";
    app.innerHTML = `<section class="card"><h1 id="tit-blocco" tabindex="-1">Tempo scaduto</h1>
      <p>Le risposte sono bloccate. La consegna online non è attiva: avvisa il docente.</p></section>`;
    document.getElementById("tit-blocco").focus();
  }

  // ---------- domande ----------
  function navigatore() {
    return `<nav class="nav" aria-label="Vai alla domanda">${CASI.map((c, i) =>
      `<button type="button" data-vai="${i}" class="${S.scelte[i] !== null ? "risposta" : ""}" ${i === S.idx && S.fase === "domanda" ? 'aria-current="true"' : ""} aria-label="Domanda ${i + 1}${S.scelte[i] !== null ? ", risposta data" : ", senza risposta"}">${i + 1}</button>`).join("")}</nav>`;
  }
  function collegaNavigatore() {
    app.querySelectorAll("[data-vai]").forEach(b => b.addEventListener("click", () => { S.idx = Number(b.dataset.vai); mostraCaso(); }));
  }

  function mostraCaso() {
    if (S.scaduto) return;                                       // tempo scaduto: risposte bloccate
    S.fase = "domanda";
    const c = CASI[S.idx], ultimo = S.idx === N - 1;
    app.innerHTML = `
      <div class="top">
        <span><strong>Domanda ${S.idx + 1} di ${N}</strong> &nbsp;${badge(c.tema)} <span class="livello">livello ${esc(c.livello)}</span></span>
        <span class="muted">Risposte date: <strong id="contatore">${date()}</strong>/${N}</span>
      </div>
      ${navigatore()}
      <section class="card" aria-labelledby="titolo-caso">
        <h2 id="titolo-caso" tabindex="-1">${esc(c.titolo)}</h2>
        <p>${esc(c.traccia)}</p>
        <div class="code" role="region" aria-label="Codice Python" tabindex="0">
          <ol>${c.codice.map((r, i) => `<li><span class="ln" aria-hidden="true">${i + 1}</span><span>${evidenzia(r) || " "}</span></li>`).join("")}</ol>
        </div>
        <fieldset>
          <legend>Che cosa stampa il programma?</legend>
          <div class="opts">
            ${c.opzioni.map((o, i) => `
              <label class="opt" id="opt-${i}">
                <input type="radio" name="risposta" value="${i}" ${S.scelte[S.idx] === i ? "checked" : ""}>
                <span class="opt-body"><span class="opt-key" aria-hidden="true">${i + 1}</span><pre>${esc(o)}</pre></span>
              </label>`).join("")}
          </div>
        </fieldset>
        <div class="actions">
          <button class="secondary" id="btn-prec" ${S.idx === 0 ? "disabled" : ""}>← Precedente</button>
          <span class="spacer"></span>
          <button id="btn-succ">${ultimo ? "Rivedi e consegna" : "Successiva →"}</button>
        </div>
      </section>
      <div class="actions"><button class="secondary" id="btn-riepilogo">Vai al riepilogo e consegna</button></div>`;
    app.querySelectorAll('input[name="risposta"]').forEach(inp => inp.addEventListener("change", () => scegli(Number(inp.value), false)));
    document.getElementById("btn-prec").addEventListener("click", () => sposta(-1));
    document.getElementById("btn-succ").addEventListener("click", () => sposta(1));
    document.getElementById("btn-riepilogo").addEventListener("click", schermataRiepilogo);
    collegaNavigatore();
    document.getElementById("titolo-caso").focus();
  }

  function scegli(i, focus) {
    if (S.scaduto || S.fase !== "domanda") return;
    S.scelte[S.idx] = i;
    const inp = app.querySelector(`input[name="risposta"][value="${i}"]`);
    if (inp) { inp.checked = true; if (focus) inp.focus(); }
    document.getElementById("contatore").textContent = date();
    const b = app.querySelector(`[data-vai="${S.idx}"]`);
    if (b) { b.classList.add("risposta"); b.setAttribute("aria-label", `Domanda ${S.idx + 1}, risposta data`); }
  }

  function sposta(d) {
    if (S.fase !== "domanda") return;
    const n = S.idx + d;
    if (n < 0) return;
    if (n >= N) { schermataRiepilogo(); return; }
    S.idx = n; mostraCaso(); window.scrollTo(0, 0);
  }

  // ---------- riepilogo e consegna ----------
  function schermataRiepilogo() {
    if (S.scaduto) return;
    S.fase = "riepilogo";
    const mancanti = N - date();
    app.innerHTML = `
      ${navigatore()}
      <section class="card" aria-labelledby="titolo-riep">
        <h1 id="titolo-riep" tabindex="-1">Riepilogo prima della consegna</h1>
        <p>${esc(S.utente.completo)} · ${esc(S.utente.email)} · classe <strong>${esc(S.classe)}</strong></p>
        <table>
          <thead><tr><th>#</th><th>Caso</th><th>La tua risposta</th></tr></thead>
          <tbody>${CASI.map((c, i) => `<tr>
            <td>${i + 1}</td>
            <td><button class="link" data-vai="${i}">${esc(c.titolo)}</button></td>
            <td>${S.scelte[i] === null ? '<span class="vuota">senza risposta</span>' : "opzione " + (S.scelte[i] + 1)}</td></tr>`).join("")}</tbody>
        </table>
        ${mancanti ? `<div class="avviso" id="avviso-mancanti">Hai <strong>${mancanti}</strong> ${mancanti === 1 ? "domanda" : "domande"} senza risposta: alla consegna ${mancanti === 1 ? "verrà contata come errata" : "verranno contate come errate"}.</div>` : ""}
        <div class="actions">
          <button class="secondary" id="btn-torna">← Torna alle domande</button>
          <button id="btn-consegna" ${CFG.appsScriptUrl ? "" : "disabled"}>Consegna il test</button>
        </div>
        ${CFG.appsScriptUrl ? "" : `<div class="avviso">La consegna online non è ancora attiva. Avvisa il docente.</div>`}
        <div id="zona-conferma"></div>
      </section>`;
    collegaNavigatore();
    document.getElementById("btn-torna").addEventListener("click", () => { S.idx = Math.min(S.idx, N - 1); mostraCaso(); });
    document.getElementById("btn-consegna").addEventListener("click", apriConferma);
    document.getElementById("titolo-riep").focus();
  }

  function apriConferma() {
    if (S.fase !== "riepilogo") return;
    S.confermaAperta = true;
    document.getElementById("zona-conferma").innerHTML = `
      <div class="conferma" role="dialog" aria-labelledby="tit-conf">
        <p id="tit-conf"><strong>Confermi la consegna?</strong> Dopo la consegna non potrai più modificare le risposte.</p>
        <div class="actions">
          <button id="btn-conferma">Sì, consegna</button>
          <button class="secondary" id="btn-annulla">Annulla</button>
        </div>
      </div>`;
    document.getElementById("btn-conferma").addEventListener("click", consegna);
    document.getElementById("btn-annulla").addEventListener("click", () => { S.confermaAperta = false; document.getElementById("zona-conferma").innerHTML = ""; document.getElementById("btn-consegna").focus(); });
    document.getElementById("btn-conferma").focus();
  }

  async function consegna() {
    const automatica = S.scaduto && S.fase === "domanda";
    if (S.fase !== "riepilogo" && S.fase !== "errore" && !automatica) return;   // evita doppio invio
    S.fase = "invio";
    app.innerHTML = `<section class="card"><h1 id="tit-invio" tabindex="-1">${S.scaduto ? "Tempo scaduto: consegna automatica in corso…" : "Invio in corso…"}</h1><p>Non chiudere la pagina.</p></section>`;
    document.getElementById("tit-invio").focus();
    const payload = {
      quizId: CFG.quizId, consegnaId: S.consegnaId, idToken: S.token, classe: S.classe,
      scelte: S.scelte, inizio: S.inizio.toISOString(), fine: new Date().toISOString(),
      browser: navigator.userAgent.slice(0, 200),
      scaduto: S.scaduto, durataMinuti: CFG.durataMinuti
    };
    let data;
    try {
      const res = await fetch(CFG.appsScriptUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      data = await res.json();
    } catch (e) {
      data = { ok: false, error: "Connessione non riuscita. Controlla la rete e riprova." };
    }
    if (data.ok) { S.risultato = data; fermaTimer(true); schermataEsito(); return; }
    schermataErrore(data);
  }

  function schermataErrore(data) {
    S.fase = "errore";
    const serveAccesso = data.codice === "token";
    app.innerHTML = `
      <section class="card">
        <h1 id="tit-err" tabindex="-1">Consegna non riuscita</h1>
        <p class="err">${esc(data.error || "Errore sconosciuto.")}</p>
        <p>Le tue risposte non sono andate perse.${S.scaduto ? " Il tempo è scaduto: le risposte sono bloccate, ripeti solo la consegna." : ""}</p>
        ${serveAccesso ? `<p>Il tuo accesso è scaduto: accedi di nuovo e la consegna ripartirà da sola.</p><div id="gsi-btn"></div><p class="err" id="err-accesso" role="alert"></p>` : ""}
        <div class="actions">
          ${serveAccesso ? "" : `<button id="btn-riprova">Riprova la consegna</button>`}
          ${S.scaduto ? "" : `<button class="secondary" id="btn-indietro">Torna al riepilogo</button>`}
        </div>
      </section>`;
    if (serveAccesso) { dopoAccesso = consegna; mostraPulsanteGoogle("gsi-btn"); }
    else document.getElementById("btn-riprova").addEventListener("click", consegna);
    const indietro = document.getElementById("btn-indietro");
    if (indietro) indietro.addEventListener("click", () => { if (!S.scaduto) schermataRiepilogo(); });
    document.getElementById("tit-err").focus();
  }

  function schermataEsito() {
    S.fase = "fine";
    const r = S.risultato;
    app.innerHTML = `
      <section class="card" aria-labelledby="titolo-fine">
        <h1 id="titolo-fine" tabindex="-1">Test consegnato</h1>
        <p>${esc(S.utente.completo)} · classe ${esc(S.classe)}</p>
        <p class="punteggio" id="punteggio-finale">${r.punteggio} / ${r.totale}</p>
        <p><span class="esito ${r.superato ? "ok" : "ko"}" id="esito-finale">${r.superato ? "SUPERATO" : "NON SUPERATO"}</span></p>
        <p class="muted">Soglia: almeno ${r.minimo} risposte esatte su ${r.totale} (${Math.round(r.soglia * 100)}%).</p>
        ${S.scaduto ? `<p><strong>Consegnato automaticamente allo scadere dei ${CFG.durataMinuti} minuti.</strong></p>` : ""}
        <p>Il risultato è stato inviato al docente.</p>
      </section>`;
    document.getElementById("titolo-fine").focus();
  }

  // ---------- tastiera e uscita dalla pagina ----------
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey || S.fase !== "domanda") return;
    const t = e.target, suRadio = t.type === "radio", suBottone = t.tagName === "BUTTON";
    if (/^[1-4]$/.test(e.key)) { e.preventDefault(); scegli(Number(e.key) - 1, true); }
    else if (e.key === "ArrowRight" && !suRadio) { e.preventDefault(); sposta(1); }
    else if (e.key === "ArrowLeft" && !suRadio) { e.preventDefault(); sposta(-1); }
    else if (e.key === "Enter" && !suBottone) { e.preventDefault(); sposta(1); }
  });
  // Nelle schede in secondo piano i browser rallentano i timer: ricontrollo al ritorno.
  document.addEventListener("visibilitychange", () => { if (S.timerId && !document.hidden) aggiornaTimer(); });
  window.addEventListener("beforeunload", e => {
    if (["domanda", "riepilogo", "invio", "errore"].includes(S.fase)) { e.preventDefault(); e.returnValue = ""; }
  });

  schermataInizio();
})();
</script>
</body>
</html>
