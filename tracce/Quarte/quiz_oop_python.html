<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz OOP in Python – Traccia l'esecuzione</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d2330; --muted: #5b6475;
    --line: #dde1e8; --accent: #2457c5; --accent-ink: #ffffff;
    --ok: #1d7a46; --ok-bg: #e5f4ec; --ko: #b3261e; --ko-bg: #fbe9e8;
    --code-bg: #1e2230; --code-ink: #e6e9ef; --hl: #3a4a7a;
    --kw: #c792ea; --str: #c3e88d; --num: #f78c6c; --bi: #82aaff; --self: #ffcb6b; --com: #8a93a6;
    --enc: #7b3fb5; --inh: #b0640a; --pol: #127a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; font-size: 16px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .badge { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: #fff; }
  .t-incapsulamento { background: var(--enc); } .t-ereditarietà { background: var(--inh); } .t-polimorfismo { background: var(--pol); }
  button { font: inherit; min-height: 44px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible + .opt-body, [tabindex]:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

  /* codice */
  .code { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; overflow-x: auto; font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; font-size: 14px; padding: 8px 0; }
  .code ol { list-style: none; margin: 0; padding: 0; min-width: max-content; }
  .code li { display: flex; padding: 0 12px 0 0; white-space: pre; border-left: 4px solid transparent; }
  .code li .ln { display: inline-block; width: 3ch; text-align: right; margin-right: 14px; color: var(--com); user-select: none; flex-shrink: 0; }
  .code li.hl { background: var(--hl); border-left-color: #f2b705; }
  .kw { color: var(--kw); } .str { color: var(--str); } .num { color: var(--num); } .bi { color: var(--bi); } .self { color: var(--self); } .com { color: var(--com); font-style: italic; } .dec { color: var(--bi); }

  /* opzioni */
  fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .opts { grid-template-columns: 1fr; } main { padding: 10px; } .card { padding: 12px; } }
  .opt { position: relative; display: block; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt-body { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; background: #fff; }
  .opt-key { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .opt pre { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .opt input:checked + .opt-body { border-color: var(--accent); background: #eef3fd; }
  .opt input:checked + .opt-body .opt-key { background: var(--accent); color: #fff; }
  .opt input:disabled + .opt-body { cursor: default; }
  .opt.giusta input + .opt-body { border-color: var(--ok); background: var(--ok-bg); }
  .opt.sbagliata input + .opt-body { border-color: var(--ko); background: var(--ko-bg); }
  .opt.giusta input + .opt-body .opt-key { background: var(--ok); color: #fff; }
  .opt.sbagliata input + .opt-body .opt-key { background: var(--ko); color: #fff; }
  .err { color: var(--ko); font-weight: 600; min-height: 1.5em; margin: 8px 0 0; }

  /* feedback */
  .esito { padding: 10px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 12px; }
  .esito.ok { background: var(--ok-bg); color: var(--ok); } .esito.ko { background: var(--ko-bg); color: var(--ko); }
  .passo { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .passo-righe { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .stato, .console { font-family: ui-monospace, Consolas, monospace; font-size: 14px; border-radius: 6px; padding: 8px 10px; margin-top: 10px; white-space: pre-wrap; word-break: break-word; }
  .stato { background: #f0f2f6; }
  .console { background: #111; color: #d7f7d7; min-height: 2.2em; }
  .lbl { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 10px; }
  .concetto { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--accent); background: #eef3fd; border-radius: 0 8px 8px 0; }
  code.inline { font-family: ui-monospace, Consolas, monospace; background: #eceff4; padding: 0 4px; border-radius: 4px; font-size: .92em; }
  .kbd-help { font-size: .85rem; color: var(--muted); }
  kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: #fff; font-size: .85em; }

  /* riepilogo */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .punteggio { font-size: 2.4rem; font-weight: 800; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

   {"righe": [13, 10, 3], "testo": "1° giro: x è un'Anatra, ha il metodo verso() → stampa 'Qua'.", "stato": "x → Anatra", "out": "Qua"},
   {"righe": [13, 10, 7], "testo": "2° giro: x è un Robot. Non è parente di Anatra, ma ha anche lui verso() → stampa 'Bip'.", "stato": "x → Robot", "out": "Qua\nBip"},
   {"righe": [13, 10], "testo": "3° giro: x è la stringa 'ciao', che non ha un metodo verso(): AttributeError solo ora, al momento della chiamata.", "stato": "x → str", "out": "Qua\nBip\nAttributeError: 'str' object has no attribute 'verso'"}
  ],
  "concetto": "Duck typing: in Python conta che l'oggetto abbia il metodo richiesto, non la sua classe. L'errore emerge solo quando il metodo manca davvero."
 },
 {
  "tema": "polimorfismo",
  "titolo": "La catena di super()",
  "traccia": "Ogni classe ridefinisce info() e richiama quella della classe superiore. Che cosa stampa?",
  "codice": [
   "class A:",
   "    def info(self):",
   "        return 'A'",
   "",
   "class B(A):",
   "    def info(self):",
   "        return 'B' + super().info()",
   "",
   "class C(B):",
   "    def info(self):",
   "        return 'C' + super().info()",
   "",
   "print(C().info())",
   "print(isinstance(C(), A))"
  ],
  "opzioni": ["C\nTrue", "ABC\nTrue", "CBA\nTrue", "CBA\nFalse"],
  "corretta": 2,
  "sequenza": [
   {"righe": [13, 11], "testo": "C().info() esegue la versione di C: 'C' + super().info(). Per completare la stringa deve prima attendere il risultato di B.", "stato": "in sospeso: 'C' + ?", "out": ""},
   {"righe": [7], "testo": "info() di B: 'B' + super().info(). Anche B resta in attesa del risultato di A.", "stato": "in sospeso: 'C' + ('B' + ?)", "out": ""},
   {"righe": [3], "testo": "info() di A restituisce 'A'. Ora le chiamate in sospeso si chiudono a ritroso: B restituisce 'BA', poi C restituisce 'CBA'.", "stato": "'C' + ('B' + 'A') = 'CBA'", "out": "CBA"},
   {"righe": [14], "testo": "C eredita da B, che eredita da A: un C è anche un A.", "stato": "C → B → A", "out": "CBA\nTrue"}
  ],
  "concetto": "Un override può estendere il metodo della base invece di sostituirlo del tutto. Le chiamate a super() si accumulano: il risultato si compone dal livello più basso verso l'alto."
 }
]
</script>

<script>
(function () {
  "use strict";
  const CASI = JSON.parse(document.getElementById("dati-casi").textContent);
  const TEMI = ["incapsulamento", "ereditarietà", "polimorfismo"];
  const app = document.getElementById("app");

  const S = { idx: 0, fase: "inizio", scelta: null, risposte: [], passo: 0 };

  // ---------- utilità ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const KW = new Set(["class","def","return","if","else","elif","for","in","try","except","pass","while","import","from","and","or","not","is","None","True","False","lambda","with","as","raise"]);
  const BI = new Set(["print","super","isinstance","len","range","property","str","int"]);
  const TOK = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(@[\w.]+)|\b(\d+)\b|\b([A-Za-z_]\w*)\b/g;
  function evidenzia(riga) {
    let out = "", last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(riga)) !== null) {
      out += esc(riga.slice(last, m.index));
      const t = esc(m[0]);
      if (m[1]) out += `<span class="com">${t}</span>`;
      else if (m[2]) out += `<span class="str">${t}</span>`;
      else if (m[3]) out += `<span class="dec">${t}</span>`;
      else if (m[4]) out += `<span class="num">${t}</span>`;
      else if (KW.has(m[5])) out += `<span class="kw">${t}</span>`;
      else if (BI.has(m[5])) out += `<span class="bi">${t}</span>`;
      else if (m[5] === "self") out += `<span class="self">${t}</span>`;
      else out += t;
      last = TOK.lastIndex;
    }
    return out + esc(riga.slice(last));
  }
  const badge = tema => `<span class="badge t-${tema}">${tema[0].toUpperCase() + tema.slice(1)}</span>`;

  // ---------- schermate ----------
  function schermataInizio() {
    S.fase = "inizio";
    app.innerHTML = `
      <div class="card">
        <h1>Traccia l'esecuzione: OOP in Python</h1>
        <p class="muted">10 casi su incapsulamento, ereditarietà e polimorfismo.</p>
        <p>Per ogni caso leggi il codice, prevedi <strong>esattamente</strong> che cosa stampa e scegli una delle 4 risposte.
        Dopo la verifica puoi rivedere l'esecuzione <strong>passo per passo</strong>, con le righe evidenziate.</p>
        <p>Hai <strong>un solo tentativo</strong> per caso. Se un'opzione contiene <code class="inline">Errore: NomeEccezione</code>, vuol dire che il programma stampa le righe precedenti e poi si ferma con quell'eccezione.</p>
        <p class="kbd-help">Tastiera: <kbd>1</kbd>–<kbd>4</kbd> scegli · <kbd>Invio</kbd> verifica / avanti · <kbd>←</kbd> <kbd>→</kbd> passi della sequenza</p>
        <div class="actions"><button id="btn-inizia">Inizia il quiz</button></div>
      </div>`;
    const b = document.getElementById("btn-inizia");
    b.addEventListener("click", () => { S.idx = 0; S.risposte = []; mostraCaso(); });
    b.focus();
  }

  function mostraCaso() {
    const c = CASI[S.idx];
    S.fase = "risposta"; S.scelta = null; S.passo = 0;
    const pct = (S.idx / CASI.length) * 100;
    app.innerHTML = `
      <div class="top">
        <span><strong>Caso ${S.idx + 1} di ${CASI.length}</strong> &nbsp;${badge(c.tema)}</span>
        <span class="muted">Punti: <strong id="punti">${punti()}</strong></span>
      </div>
      <div class="progress" role="progressbar" aria-label="Avanzamento" aria-valuemin="0" aria-valuemax="${CASI.length}" aria-valuenow="${S.idx}"><div style="width:${pct}%"></div></div>
      <section class="card" aria-labelledby="titolo-caso">
        <h2 id="titolo-caso" tabindex="-1">${esc(c.titolo)}</h2>
        <p>${esc(c.traccia)}</p>
        <div class="code" role="region" aria-label="Codice Python" tabindex="0">
          <ol id="codice">${c.codice.map((r, i) => `<li data-r="${i + 1}"><span class="ln" aria-hidden="true">${i + 1}</span><span>${evidenzia(r) || " "}</span></li>`).join("")}</ol>
        </div>
        <fieldset>
          <legend>Che cosa stampa il programma?</legend>
          <div class="opts" id="opts">
            ${c.opzioni.map((o, i) => `
              <label class="opt" id="opt-${i}">
                <input type="radio" name="risposta" value="${i}">
                <span class="opt-body"><span class="opt-key" aria-hidden="true">${i + 1}</span><pre>${esc(o)}</pre></span>
              </label>`).join("")}
          </div>
        </fieldset>
        <p class="err" id="err" role="alert"></p>
        <div class="actions"><button id="btn-verifica">Verifica</button></div>
      </section>
      <div id="feedback"></div>`;
    app.querySelectorAll('input[name="risposta"]').forEach(inp =>
      inp.addEventListener("change", () => { S.scelta = Number(inp.value); document.getElementById("err").textContent = ""; }));
    document.getElementById("btn-verifica").addEventListener("click", verifica);
    document.getElementById("titolo-caso").focus();
  }

  function verifica() {
    if (S.fase !== "risposta") return;                         // doppio click / doppio Invio
    if (S.scelta === null) {
      document.getElementById("err").textContent = "Seleziona una risposta prima di verificare.";
      return;
    }
    const c = CASI[S.idx];
    const giusta = S.scelta === c.corretta;
    S.risposte[S.idx] = { scelta: S.scelta, giusta };
    S.fase = "feedback";

    app.querySelectorAll('input[name="risposta"]').forEach(i => i.disabled = true);
    document.getElementById(`opt-${c.corretta}`).classList.add("giusta");
    if (!giusta) document.getElementById(`opt-${S.scelta}`).classList.add("sbagliata");
    document.getElementById("btn-verifica").disabled = true;
    document.getElementById("punti").textContent = punti();

    const ultimo = S.idx === CASI.length - 1;
    document.getElementById("feedback").innerHTML = `
      <section class="card" aria-labelledby="titolo-fb">
        <h2 id="titolo-fb" tabindex="-1" class="sr-only">Esito e sequenza di esecuzione</h2>
        <div class="esito ${giusta ? "ok" : "ko"}" id="esito">${giusta ? "✔ Corretto!" : "✘ Non corretto. La risposta giusta è la " + (c.corretta + 1) + "."}</div>
        <h3>Sequenza di esecuzione</h3>
        <div class="passo" id="passo" aria-live="polite"></div>
        <div class="actions">
          <button class="secondary" id="btn-prec">← Passo precedente</button>
          <button class="secondary" id="btn-succ">Passo successivo →</button>
        </div>
        <div class="concetto"><strong>Concetto chiave.</strong> ${esc(c.concetto)}</div>
        <div class="actions"><button id="btn-avanti">${ultimo ? "Vedi il riepilogo" : "Caso successivo"}</button></div>
      </section>`;
    document.getElementById("btn-prec").addEventListener("click", () => vaiPasso(-1));
    document.getElementById("btn-succ").addEventListener("click", () => vaiPasso(1));
    document.getElementById("btn-avanti").addEventListener("click", avanti);
    disegnaPasso();
    document.getElementById("esito").setAttribute("tabindex", "-1");
    document.getElementById("esito").focus();
  }

  function disegnaPasso() {
    const c = CASI[S.idx], seq = c.sequenza, p = seq[S.passo];
    document.getElementById("passo").innerHTML = `
      <div class="passo-righe">Passo ${S.passo + 1} di ${seq.length} · riga ${p.righe.join(" → ")}</div>
      <div>${esc(p.testo)}</div>
      <span class="lbl">Stato</span><div class="stato">${esc(p.stato || "–")}</div>
      <span class="lbl">Console (output finora)</span><div class="console">${esc(p.out || "")}</div>`;
    app.querySelectorAll("#codice li").forEach(li => li.classList.toggle("hl", p.righe.includes(Number(li.dataset.r))));
    document.getElementById("btn-prec").disabled = S.passo === 0;
    document.getElementById("btn-succ").disabled = S.passo === seq.length - 1;
  }

  function vaiPasso(d) {
    if (S.fase !== "feedback") return;
    const n = S.passo + d;
    if (n < 0 || n >= CASI[S.idx].sequenza.length) return;
    S.passo = n; disegnaPasso();
  }

  function avanti() {
    if (S.fase !== "feedback") return;
    if (S.idx < CASI.length - 1) { S.idx++; mostraCaso(); window.scrollTo(0, 0); }
    else schermataFine();
  }

  const punti = () => S.risposte.filter(r => r && r.giusta).length;

  function schermataFine() {
    S.fase = "fine";
    const perTema = TEMI.map(t => {
      const ids = CASI.map((c, i) => c.tema === t ? i : -1).filter(i => i >= 0);
      return { t, tot: ids.length, ok: ids.filter(i => S.risposte[i].giusta).length };
    });
    app.innerHTML = `
      <section class="card" aria-labelledby="titolo-fine">
        <h1 id="titolo-fine" tabindex="-1">Riepilogo</h1>
        <p class="punteggio" id="punteggio-finale">${punti()} / ${CASI.length}</p>
        <table>
          <thead><tr><th>Tema</th><th>Corrette</th></tr></thead>
          <tbody>${perTema.map(x => `<tr><td>${badge(x.t)}</td><td>${x.ok} / ${x.tot}</td></tr>`).join("")}</tbody>
        </table>
      </section>
      <section class="card">
        <h2>Dettaglio dei casi</h2>
        <table>
          <thead><tr><th>#</th><th>Caso</th><th>Esito</th></tr></thead>
          <tbody>${CASI.map((c, i) => `<tr><td>${i + 1}</td><td>${esc(c.titolo)}<br><span class="muted">${c.tema}</span></td><td>${S.risposte[i].giusta ? "✔" : "✘ (giusta: " + (c.corretta + 1) + ")"}</td></tr>`).join("")}</tbody>
        </table>
        <div class="actions"><button id="btn-ricomincia">Ricomincia</button></div>
      </section>`;
    document.getElementById("btn-ricomincia").addEventListener("click", () => { S.idx = 0; S.risposte = []; mostraCaso(); });
    document.getElementById("titolo-fine").focus();
  }

  // ---------- tastiera ----------
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const suBottone = e.target.tagName === "BUTTON";
    if (S.fase === "risposta") {
      if (/^[1-4]$/.test(e.key)) {
        const inp = app.querySelector(`input[name="risposta"][value="${Number(e.key) - 1}"]`);
        if (inp) { inp.checked = true; inp.dispatchEvent(new Event("change")); inp.focus(); e.preventDefault(); }
      } else if (e.key === "Enter" && !suBottone) { e.preventDefault(); verifica(); }
    } else if (S.fase === "feedback") {
      if (e.key === "ArrowRight") { e.preventDefault(); vaiPasso(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); vaiPasso(-1); }
      else if (e.key === "Enter" && !suBottone) { e.preventDefault(); avanti(); }
    }
  });

  schermataInizio();
})();
</script>
</body>
</html>
