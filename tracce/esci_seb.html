<!DOCTYPE html>

<head>

<title>Prova terminata</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #1d2330; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; border: 1px solid #dde1e8; border-radius: 10px; padding: 24px; max-width: 460px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
</style>
</head>
<body>
  <!-- Indirizzo usato come «Link to quit SEB after exam» (quitURL) nei file .seb dei quiz:
       quando Safe Exam Browser arriva qui, chiede conferma e si chiude. -->
  <div class="card">
    <h1>Prova terminata</h1>
    <p>Il test è stato consegnato. Safe Exam Browser si sta chiudendo.</p>
    <p>Se non si chiude da solo, avvisa il docente.</p>
  </div>
</body>
