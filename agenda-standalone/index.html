ng:4px 5px;border-radius:6px;background:#eef2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event{display:grid;grid-template-columns:7px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e7ebf0}.bar{border-radius:8px;background:#94a3b8}.high .bar{background:#dc2626}.medium .bar{background:#d97706}.low .bar{background:#16a34a}.event h3{margin:0;font-size:16px}.meta{font-size:13px;color:#64748b;margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f7;margin:5px 4px 0 0;font-size:11px}.empty{padding:36px;text-align:center;color:#64748b}@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.cal-cell{min-height:72px;padding:5px}}</style></head><body><div class="wrap"><header><div class="brand"><h1>Agenda elettronica</h1><p>Prof. Antonio Adinolfi · App autonoma</p></div><div class="actions"><button id="install" hidden>Installa app</button><button id="icsBtn">Esporta .ics</button><button class="primary" id="newBtn">+ Nuovo impegno</button></div></header><div class="stats"><div class="stat"><small>Oggi</small><strong id="sToday">0</strong></div><div class="stat"><small>Settimana</small><strong id="sWeek">0</strong></div><div class="stat"><small>Da fare</small><strong id="sTodo">0</strong></div><div class="stat"><small>Alta priorità</small><strong id="sHigh">0</strong></div></div><div class="layout"><aside class="panel" id="formPanel"><h2>Nuovo / modifica</h2><form id="form"><input type="hidden" id="id"><label>Data</label><input id="date" type="date" required><label>Ora</label><input id="time" type="time"><label>Categoria</label><select id="category"><option>SCUOLA</option><option>INVALSI</option><option>RSPP / SICUREZZA</option><option>PROFESSIONE</option><option>FORMAZIONE</option><option>PROGETTI</option><option>PERSONALE</option></select><label>Impegno</label><input id="title" required><label>Descrizione</label><textarea id="desc" rows="3"></textarea><label>Priorità</label><select id="priority"><option>Alta</option><option selected>Media</option><option>Bassa</option></select><label>Promemoria</label><select id="reminder"><option>Nessuno</option><option>1 giorno prima</option><option>2 ore prima</option><option>30 minuti prima</option></select><div class="actions" style="margin-top:12px"><button class="primary" type="submit">Salva</button><button type="button" id="cancel">Annulla</button></div></form><div class="sync" id="sync">App autonoma · archivio locale.</div></aside><main class="panel"><div class="viewbar"><button id="listView" class="active">Agenda</button><button id="calendarView">Calendario</button></div><div id="calendarPanel" hidden><div class="calendar-head"><h2 id="monthTitle"></h2><div class="calendar-nav"><button id="prevMonth">‹</button><button id="todayMonth">Oggi</button><button id="nextMonth">›</button></div></div><div class="calendar-grid" id="calendarGrid"></div></div><div id="listPanel"><div class="tabs"><button class="active" data-filter="all">Tutti</button><button data-filter="today">Oggi</button><button data-filter="week">Settimana</button><button data-filter="todo">Da fare</button><button data-filter="high">Alta priorità</button></div><div style="display:grid;grid-template-columns:1fr 220px;gap:8px;margin-bottom:12px"><input id="search" type="search" placeholder="Cerca..."><select id="cat"><option value="all">Tutte le categorie</option><option>SCUOLA</option><option>INVALSI</option><option>RSPP / SICUREZZA</option><option>PROFESSIONE</option><option>FORMAZIONE</option><option>PROGETTI</option><option>PERSONALE</option></select></div><div id="list"></div></div></main></div></div><script src="app.js?v=1"></script></body></html>
