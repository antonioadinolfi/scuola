<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Il ciclo della verifica</title><desc id="d">Infografica circolare in cinque passi: prompt preciso, output dell'IA, verifica su fonte, correzione, uso in classe.</desc><rect width="1000" height="720" rx="18" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#087f78"/></marker></defs><rect width="1000" height="96" rx="18" fill="#153a52"/><rect y="70" width="1000" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Il ciclo della verifica</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Ogni risposta dell'IA passa da una fonte prima di arrivare in classe</text><circle cx="500" cy="420" r="220" fill="none" stroke="#cfe3e0" stroke-width="18"/><path d="M568,211 A220,220 0 0 1 678,291" fill="none" stroke="#087f78" stroke-width="6" marker-end="url(#ar)"/><path d="M720,420 A220,220 0 0 1 678,549" fill="none" stroke="#087f78" stroke-width="6" marker-end="url(#ar)"/><path d="M568,629 A220,220 0 0 1 432,629" fill="none" stroke="#087f78" stroke-width="6" marker-end="url(#ar)"/><path d="M322,549 A220,220 0 0 1 280,420" fill="none" stroke="#087f78" stroke-width="6" marker-end="url(#ar)"/><path d="M322,291 A220,220 0 0 1 432,211" fill="none" stroke="#087f78" stroke-width="6" marker-end="url(#ar)"/><circle cx="500" cy="200" r="70" fill="#ffffff" stroke="#153a52" stroke-width="4"/><text x="500.0" y="174.0" font-size="22" font-weight="800" fill="#153a52" text-anchor="middle" >1</text><text x="500.0" y="200.0" font-size="16" font-weight="800" fill="#173447" text-anchor="middle" >Prompt preciso</text><text font-size="13" font-weight="400" fill="#456" text-anchor="middle"><tspan x="500.0" y="220.0">Ruolo, compito,</tspan><tspan x="500.0" y="236.0">vincoli, formato</tspan></text><circle cx="709" cy="352" r="70" fill="#ffffff" stroke="#153a52" stroke-width="4"/><text x="709.2324335849338" y="326.01626123751157" font-size="22" font-weight="800" fill="#153a52" text-anchor="middle" >2</text><text x="709.2324335849338" y="352.01626123751157" font-size="16" font-weight="800" fill="#173447" text-anchor="middle" >Output dell'IA</text><text font-size="13" font-weight="400" fill="#456" text-anchor="middle"><tspan x="709.2324335849338" y="372.0">Tabella, testo,</tspan><tspan x="709.2324335849338" y="388.0">codice</tspan></text><circle cx="629" cy="598" r="70" fill="#ffffff" stroke="#e0674a" stroke-width="4"/><text x="629.3127555043441" y="571.9837387624884" font-size="22" font-weight="800" fill="#e0674a" text-anchor="middle" >3</text><text x="629.3127555043441" y="597.9837387624884" font-size="16" font-weight="800" fill="#173447" text-anchor="middle" >Verifica su fonte</text><text font-size="13" font-weight="400" fill="#456" text-anchor="middle"><tspan x="629.3127555043441" y="618.0">Etichetta, norma,</tspan><tspan x="629.3127555043441" y="634.0">CREA, EFSA, testo</tspan></text><circle cx="371" cy="598" r="70" fill="#ffffff" stroke="#153a52" stroke-width="4"/><text x="370.68724449565593" y="571.9837387624884" font-size="22" font-weight="800" fill="#153a52" text-anchor="middle" >4</text><text x="370.68724449565593" y="597.9837387624884" font-size="16" font-weight="800" fill="#173447" text-anchor="middle" >Correzione</text><text font-size="13" font-weight="400" fill="#456" text-anchor="middle"><tspan x="370.68724449565593" y="618.0">Errori segnati,</tspan><tspan x="370.68724449565593" y="634.0">prompt migliorato</tspan></text><circle cx="291" cy="352" r="70" fill="#ffffff" stroke="#087f78" stroke-width="4"/><text x="290.7675664150662" y="326.01626123751157" font-size="22" font-weight="800" fill="#087f78" text-anchor="middle" >5</text><text 