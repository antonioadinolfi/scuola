<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Il viaggio dell'amido</title><desc id="d">Infografica in cinque tappe: bocca con amilasi salivare, stomaco dove si inattiva, duodeno con amilasi pancreatica, orletto a spazzola con maltasi e isomaltasi, assorbimento del glucosio tramite SGLT1 e GLUT2; nota sulle fibre fermentate nel colon.</desc><rect width="1200" height="590" rx="18" fill="#ffffff"/><defs><marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#f2a33d"/></marker></defs><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Il viaggio dell'amido</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Dalla bocca alla glicemia: enzimi, sedi e prodotti</text><rect x="24" y="126" width="214" height="330" rx="16" fill="#e9f5ff" stroke="#153a52" stroke-width="2"/><circle cx="131" cy="166" r="26" fill="#153a52"/><text x="131" y="174" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text><text x="131" y="222" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Bocca</text><text font-size="15" font-weight="700" fill="#087f78" text-anchor="middle"><tspan x="131" y="252.0">α-amilasi salivare</tspan></text><text font-size="14" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="131" y="312.0">Inizia l'idrolisi dei</tspan><tspan x="131" y="330.0">legami α-1,4</tspan></text><line x1="44" y1="356" x2="218" y2="356" stroke="#9fb3b8" stroke-dasharray="4 4"/><text x="131" y="380" font-size="12" font-weight="700" fill="#57717b" text-anchor="middle" >Prodotto</text><text font-size="15" font-weight="700" fill="#173447" text-anchor="middle"><tspan x="131" y="402.0">Destrine, maltosio</tspan></text><path d="M240,290 l14,0" stroke="#f2a33d" stroke-width="6" marker-end="url(#ar2)"/><rect x="258" y="126" width="214" height="330" rx="16" fill="#fff1e6" stroke="#153a52" stroke-width="2"/><circle cx="365" cy="166" r="26" fill="#153a52"/><text x="365" y="174" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text><text x="365" y="222" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Stomaco</text><text font-size="15" font-weight="700" fill="#087f78" text-anchor="middle"><tspan x="365" y="252.0">pH acido</tspan></text><text font-size="14" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="365" y="312.0">L'amilasi salivare</tspan><tspan x="365" y="330.0">si inattiva</tspan></text><line x1="278" y1="356" x2="452" y2="356" stroke="#9fb3b8" stroke-dasharray="4 4"/><text x="365" y="380" font-size="12" font-weight="700" fill="#57717b" text-anchor="middle" >Prodotto</text><text font-size="15" font-weight="700" fill="#173447" text-anchor="middle"><tspan x="365" y="402.0">Digestione in pausa</tspan></text><path d="M474,290 l14,0" stroke="#f2a33d" stroke-width="6" marker-end="url(#ar2)"/><rect x="492" y="126" width="214" height="330" rx="16" fill="#e3f4f1" stroke="#153a52" stroke-width="2"/><circle cx="599" cy="166" r="26" fill="#153a52"/><text x="599" y="174" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >3</text><text x="599" y="222" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Duodeno</text><text font-size="15" font-weight="700" fill="#087f78" text-anchor="middle"><tspan x="599" y="252.0">α-amilasi pancreatica</tspan></text><text font-size="14" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="599" y="312.0">Idrolisi nel lume</tspan><tspan x="599" y="330.0">intestinale</tspan></text><line x1="512" y1="356" x2="686" y2="356" stroke="#9fb3b8" stroke-dasharray="4 4"/><text x="599" y="380" font-size="12" font-weight="700" fill="#57717b" text-anchor="middle" >Prodotto</text><text font-size="15" font-weight="700" fill="#173447" text-anchor="middle"><tspan x="599" y="402.0">Maltosio,</tspan><tspan x="599" y="421.0">maltotriosio,</tspan><tspan x="599" y="440.0">α-destrine limite</tspan></text><path d="M708,290 l14,0" stroke="#f2a33d" stroke-width="6" marker-end="url(#ar2)"/><rect x="726" y="126" width="214" height="330" rx="16" fill="#eef0ff" stroke="#153a52" stroke-width="2"/><circle cx="833" cy="166" r="26" fill="#153a52"/><text x="833" y="174" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >4</text><text x="833" y="222" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Orletto a spazzola</text><text font-size="15" font-weight="700" fill="#087f78" text-anchor="middle"><tspan x="833" y="252.0">Maltasi-glucoamilasi,</tspan><tspan x="833" y="271.0">sucrasi-isomaltasi</tspan></text><text font-size="14" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="833" y="312.0">Enzimi di membrana</tspan><tspan x="833" y="330.0">degli enterociti</tspan></text><line x1="746" y1="356" x2="920" y2="356" stroke="#9fb3b8" stroke-dasharray="4 4"/><text x="833" y="380" font-size="12" font-weight="700" fill="#57717b" text-anchor="middle" >Prodotto</text><text font-size="15" font-weight="700" fill="#173447" text-anchor="middle"><tspan x="833" y="402.0">Glucosio</tspan></text><path d="M942,290 l14,0" stroke="#f2a33d" stroke-width="6" marker-end="url(#ar2)"/><rect x="960" y="126" width="214" height="330" rx="16" fill="#fdeef0" stroke="#153a52" stroke-width="2"/><circle cx="1067" cy="166" r="26" fill="#153a52"/><text x="1067" y="174" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >5</text><text x="1067" y="222" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Assorbimento</text><text font-size="15" font-weight="700" fill="#087f78" text-anchor="middle"><tspan x="1067" y="252.0">SGLT1 → GLUT2</tspan></text><text font-size="14" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="1067" y="312.0">Ingresso con Na⁺,</tspan><tspan x="1067" y="330.0">uscita verso il sangue</tspan></text><line x1="980" y1="356" x2="1154" y2="356" stroke="#9fb3b8" stroke-dasharray="4 4"/><text x="1067" y="380" font-size="12" font-weight="700" fill="#57717b" text-anchor="middle" >Prodotto</text><text font-size="15" font-weight="700" fill="#173447" text-anchor="middle"><tspan x="1067" y="402.0">Glucosio nella vena</tspan><tspan x="1067" y="421.0">porta → glicemia</tspan></text><rect x="24" y="476" width="1152" height="92" rx="16" fill="#fff6e6" stroke="#f2a33d" stroke-width="2"/><text font-size="15" font-weight="400" fill="#173447" text-anchor="start"><tspan x="44" y="506.0"><tspan font-weight="700">E le fibre?</tspan> Amido resistente e fibre arrivano al colon, dove il microbiota le fermenta producendo acidi grassi a catena corta:</tspan><tspan x="44" y="530.0">è il motivo per cui il Reg. (UE) 1169/2011 assegna alle fibre 2 kcal/g anziché 0. Fonti per la verifica: testo di fisiologia/biochimica in adozione.</tspan></text></svg>