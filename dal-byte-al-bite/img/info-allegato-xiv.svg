<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Quanta energia per grammo?</title><desc id="d">Infografica a barre dei coefficienti dell'allegato XIV: carboidrati 4 kcal/g (17 kJ), proteine 4 (17), grassi 9 (37), alcol 7 (29), salatrim 6 (25), acidi organici 3 (13), polioli 2,4 (10), fibre 2 (8), eritritolo 0.</desc><rect width="1200" height="690" rx="18" fill="#ffffff"/><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Quanta energia per grammo?</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Coefficienti di conversione – Reg. (UE) 1169/2011, allegato XIV</text><text x="470" y="130" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >kcal/g</text><text x="1120" y="130" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >kJ/g</text><text x="40" y="170" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Carboidrati (esclusi polioli)</text><rect x="330" y="152" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="152" width="320" height="26" rx="6" fill="#087f78"/><text x="660" y="171" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >4</text><text x="1120" y="171" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >17</text><text x="40" y="214" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Proteine</text><rect x="330" y="196" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="196" width="320" height="26" rx="6" fill="#087f78"/><text x="660" y="215" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >4</text><text x="1120" y="215" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >17</text><text x="40" y="258" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Grassi</text><rect x="330" y="240" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="240" width="720" height="26" rx="6" fill="#087f78"/><text x="1060" y="259" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >9</text><text x="1120" y="259" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >37</text><text x="40" y="302" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Alcol (etanolo)</text><rect x="330" y="284" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="284" width="560" height="26" rx="6" fill="#f2a33d"/><text x="900" y="303" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >7</text><text x="1120" y="303" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >29</text><text x="40" y="346" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Salatrim</text><rect x="330" y="328" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="328" width="480" height="26" rx="6" fill="#f2a33d"/><text x="820" y="347" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >6</text><text x="1120" y="347" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >25</text><text x="40" y="390" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Acidi organici</text><rect x="330" y="372" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="372" width="240" height="26" rx="6" fill="#f2a33d"/><text x="580" y="391" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >3</text><text x="1120" y="391" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >13</text><text x="40" y="434" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Polioli</text><rect x="330" y="416" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="416" width="192.0" height="26" rx="6" fill="#f2a33d"/><text x="532.0" y="435" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >2,4</text><text x="1120" y="435" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >10</text><text x="40" y="478" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Fibre</text><rect x="330" y="460" width="720" height="26" rx="6" fill="#eef4f4"/><rect x="330" y="460" width="160" height="26" rx="6" fill="#f2a33d"/><text x="500" y="479" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >2</text><text x="1120" y="479" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >8</text><text x="40" y="522" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Eritritolo</text><rect x="330" y="504" width="720" height="26" rx="6" fill="#eef4f4"/><text x="340" y="523" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >0</text><text x="1120" y="523" font-size="17" font-weight="700" fill="#173447" text-anchor="middle" >0</text><rect x="40" y="552" width="22" height="18" rx="4" fill="#087f78"/><text x="72" y="567" font-size="16" font-weight="600" fill="#173447" text-anchor="start" >Nel modello semplificato 4–4–9</text><rect x="370" y="552" width="22" height="18" rx="4" fill="#f2a33d"/><text x="402" y="567" font-size="16" font-weight="600" fill="#173447" text-anchor="start" >Ignorati dal modello 4–4–9: causa degli scarti con l'etichetta</text><rect x="40" y="590" width="1120" height="76" rx="16" fill="#fff6e6" stroke="#f2a33d" stroke-width="2"/><text font-size="16" font-weight="400" fill="#173447" text-anchor="start"><tspan x="60" y="620.0"><tspan font-weight="700">Attenzione ai kJ:</tspan> i coefficienti in kJ non sono le kcal × 4,184 (17/4 = 4,25; 37/9 ≈ 4,11).</tspan><tspan x="60" y="644.0">L'energia in kJ si calcola con i coefficienti in kJ. I «carboidrati» in etichetta includono i polioli.</tspan></text></svg>