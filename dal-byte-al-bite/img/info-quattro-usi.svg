<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Quattro modi in cui l'IA aiuta il docente</title><desc id="d">Infografica: quattro usi didattici dell'IA – strutturare dati reali, generare spiegazioni da revisionare, co-progettare attività investigative, costruire simulatori – con il ruolo dell'IA e quello del docente.</desc><rect width="1200" height="470" rx="18" fill="#ffffff"/><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Quattro modi in cui l'IA aiuta il docente</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Scienze applicate alla salute: l'IA propone, il docente verifica e decide</text><rect x="24" y="122" width="566" height="150" rx="16" fill="#ffffff" stroke="#087f78" stroke-width="2"/><rect x="24" y="122" width="14" height="150" rx="7" fill="#087f78"/><text x="60" y="162" font-size="22" font-weight="800" fill="#087f78" text-anchor="start" >1. Strutturare dati reali</text><circle cx="74" cy="200" r="9" fill="#087f78"/><text x="94" y="206" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >L'IA trascrive e normalizza</text><circle cx="74" cy="238" r="9" fill="#ffffff" stroke="#087f78" stroke-width="3"/><text x="94" y="244" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Tu controlli ogni numero</text><rect x="610" y="122" width="566" height="150" rx="16" fill="#ffffff" stroke="#347ca9" stroke-width="2"/><rect x="610" y="122" width="14" height="150" rx="7" fill="#347ca9"/><text x="646" y="162" font-size="22" font-weight="800" fill="#347ca9" text-anchor="start" >2. Spiegazioni da revisionare</text><circle cx="660" cy="200" r="9" fill="#347ca9"/><text x="680" y="206" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >L'IA scrive affermazioni numerate</text><circle cx="660" cy="238" r="9" fill="#ffffff" stroke="#347ca9" stroke-width="3"/><text x="680" y="244" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Tu verifichi e correggi</text><rect x="24" y="290" width="566" height="150" rx="16" fill="#ffffff" stroke="#c47a12" stroke-width="2"/><rect x="24" y="290" width="14" height="150" rx="7" fill="#c47a12"/><text x="60" y="330" font-size="22" font-weight="800" fill="#c47a12" text-anchor="start" >3. Attività investigative</text><circle cx="74" cy="368" r="9" fill="#c47a12"/><text x="94" y="374" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >L'IA propone ipotesi e dati simulati</text><circle cx="74" cy="406" r="9" fill="#ffffff" stroke="#c47a12" stroke-width="3"/><text x="94" y="412" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Tu adatti alla classe</text><rect x="610" y="290" width="566" height="150" rx="16" fill="#ffffff" stroke="#e0674a" stroke-width="2"/><rect x="610" y="290" width="14" height="150" rx="7" fill="#e0674a"/><text x="646" y="330" font-size="22" font-weight="800" fill="#e0674a" text-anchor="start" >4. Simulatori</text><circle cx="660" cy="368" r="9" fill="#e0674a"/><text x="680" y="374" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >L'IA scrive il codice</text><circle cx="660" cy="406" r="9" fill="#ffffff" stroke="#e0674a" stroke-width="3"/><text x="680" y="412" font-size="18" font-weight="700" fill="#173447" text-anchor="start" >Tu definisci requisiti e test</text></svg>