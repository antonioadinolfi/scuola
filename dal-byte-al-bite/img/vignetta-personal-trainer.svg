y="274.0">9,3 MET × 3,5</tspan><tspan x="632" y="294.0">× 70 kg / 200</tspan><tspan x="632" y="314.0">≈ 11 kcal/min</tspan></text><path d="M518,185.28 L530,212 L544,185.28" fill="#ffffff" stroke="#153a52" stroke-width="2.5" stroke-linejoin="round"/><rect x="434" y="100" width="330" height="87" rx="16" fill="#ffffff" stroke="#153a52" stroke-width="2.5"/><path d="M520,185.28 L542,185.28" stroke="#ffffff" stroke-width="5"/><text font-size="17" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="599.0" y="129.0">Due ore? Facciamo i conti</tspan><tspan x="599.0" y="150.8">con i MET: corsa a 10 km/h,</tspan><tspan x="599.0" y="172.5">adulto di 70 kg.</tspan></text><text x="424" y="92" font-size="16" font-weight="800" fill="#087f78" text-anchor="start" >2</text></g><g><rect x="805" y="66" width="380" height="388" rx="12" fill="#f1f8f7" stroke="#153a52" stroke-width="3"/><rect x="805" y="400" width="380" height="54" rx="0" fill="#d6ebe8" opacity=".7"/><rect x="805" y="66" width="380" height="388" rx="12" fill="none" stroke="#153a52" stroke-width="3"/><g transform="translate(925,440) scale(0.95,0.95)" stroke="#153a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="10" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="-34" y="-8" width="30" height="10" rx="5" fill="#153a52"/><rect x="4" y="-8" width="30" height="10" rx="5" fill="#153a52"/><path d="M-40,-96 Q-62,-70 -58,-46" fill="none" stroke-width="9" stroke="#153a52"/><path d="M40,-96 Q78,-120 52,-168" fill="none" stroke-width="9" stroke="#153a52"/><circle cx="-58" cy="-46" r="8" fill="#9fc9c4"/><circle cx="52" cy="-168" r="8" fill="#9fc9c4"/><rect x="-42" y="-108" width="84" height="74" rx="18" fill="#087f78"/><circle cx="0" cy="-72" r="13" fill="#f2a33d"/><text x="0" y="-66" font-size="15" font-weight="800" fill="#153a52" stroke="none" text-anchor="middle">B</text><line x1="0" y1="-196" x2="0" y2="-216"/>