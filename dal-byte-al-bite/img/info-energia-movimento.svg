<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Energia in movimento</title><desc id="d">Infografica: valori MET del 2024 Adult Compendium – camminata svelta 4,8, nuoto lento 5,8, calcio amatoriale 7,0, pallacanestro 7,5, corsa a 8 km/h 8,5, corsa a 10 km/h 9,3 – con kcal al minuto per un adulto di 70 kg e minuti equivalenti a una barretta da 158 kcal; formula kcal/min = MET × 3,5 × kg / 200.</desc><rect width="1200" height="600" rx="18" fill="#ffffff"/><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Energia in movimento</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >MET dal 2024 Adult Compendium of Physical Activities · esempio per un adulto di riferimento di 70 kg</text><text x="560" y="130" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >MET</text><text x="905" y="130" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >kcal/min</text><text x="1090" y="130" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >min per 158 kcal</text><text x="40" y="171" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Camminata a passo svelto (5,6–6,3 km/h)</text><text x="40" y="188" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 17200</text><rect x="420" y="154" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="154" width="192" height="26" rx="6" fill="#087f78"/><text x="622.0" y="173" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >4,8</text><text x="905" y="173" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >5,9</text><text x="1090" y="173" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 27</text><text x="40" y="221" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Nuoto, stile libero lento</text><text x="40" y="238" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 18240</text><rect x="420" y="204" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="204" width="232" height="26" rx="6" fill="#087f78"/><text x="662.0" y="223" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >5,8</text><text x="905" y="223" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >7,1</text><text x="1090" y="223" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 22</text><text x="40" y="271" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Calcio, partita amatoriale</text><text x="40" y="288" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 15610</text><rect x="420" y="254" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="254" width="280" height="26" rx="6" fill="#087f78"/><text x="710.0" y="273" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >7,0</text><text x="905" y="273" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >8,6</text><text x="1090" y="273" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 18</text><text x="40" y="321" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Pallacanestro, generale</text><text x="40" y="338" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 15055</text><rect x="420" y="304" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="304" width="300" height="26" rx="6" fill="#087f78"/><text x="730.0" y="323" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >7,5</text><text x="905" y="323" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >9,2</text><text x="1090" y="323" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 17</text><text x="40" y="371" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Corsa a circa 8 km/h</text><text x="40" y="388" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 12030</text><rect x="420" y="354" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="354" width="340" height="26" rx="6" fill="#087f78"/><text x="770.0" y="373" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >8,5</text><text x="905" y="373" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >10,4</text><text x="1090" y="373" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 15</text><text x="40" y="421" font-size="18" font-weight="600" fill="#173447" text-anchor="start" >Corsa a circa 10 km/h</text><text x="40" y="438" font-size="11" font-weight="400" fill="#57717b" text-anchor="start" >codice 12050</text><rect x="420" y="404" width="400" height="26" rx="6" fill="#eef4f4"/><rect x="420" y="404" width="372" height="26" rx="6" fill="#087f78"/><text x="802.0" y="423" font-size="17" font-weight="800" fill="#173447" text-anchor="start" >9,3</text><text x="905" y="423" font-size="18" font-weight="700" fill="#173447" text-anchor="middle" >11,4</text><text x="1090" y="423" font-size="18" font-weight="800" fill="#e0674a" text-anchor="middle" >≈ 14</text><rect x="40" y="458" width="540" height="116" rx="16" fill="#e3f4f1" stroke="#087f78" stroke-width="2"/><text font-size="17" font-weight="400" fill="#173447" text-anchor="start"><tspan x="60" y="490.0"><tspan font-weight="700">La formula</tspan></tspan><tspan x="60" y="516.0">kcal/min = MET × 3,5 × massa (kg) / 200</tspan><tspan x="60" y="542.0">1 MET = 3,5 mL di O₂ per kg al minuto (riposo)</tspan></text><rect x="620" y="458" width="540" height="116" rx="16" fill="#fff6e6" stroke="#f2a33d" stroke-width="2"/><text font-size="16" font-weight="400" fill="#173447" text-anchor="start"><tspan x="640" y="490.0"><tspan font-weight="700">Da discutere in classe</tspan></tspan><tspan x="640" y="515.0">Valori lordi (includono il riposo), per adulti 19–59 anni;</tspan><tspan x="640" y="540.0">per i ragazzi esiste un Youth Compendium. Niente «debiti».</tspan></text></svg>