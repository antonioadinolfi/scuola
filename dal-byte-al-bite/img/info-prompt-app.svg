<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Dal prompt all'app</title><desc id="d">Infografica di flusso: requisiti, generazione, test, correzione, microattività; se un test fallisce si torna alla correzione; regola dei 60 minuti; l'IA scrive il codice ma il calcolo è deterministico.</desc><rect width="1200" height="520" rx="18" fill="#ffffff"/><defs><marker id="ar3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#e0674a"/></marker></defs><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Dal prompt all'app</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Il flusso della seconda lezione: l'IA scrive il codice, i test decidono se funziona</text><path d="M24,130 h196 l26,64 l-26,64 h-196 l26,-64z" fill="#e3f4f1" stroke="#153a52" stroke-width="2.5"/><text x="140" y="176" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Requisiti</text><text x="140" y="202" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >30 min</text><text font-size="13" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="140" y="226.0">Input, formula,</tspan><tspan x="140" y="242.0">unità, output, limiti</tspan></text><path d="M258,130 h196 l26,64 l-26,64 h-196 l26,-64z" fill="#e5f0f8" stroke="#153a52" stroke-width="2.5"/><text x="374" y="176" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Generazione</text><text x="374" y="202" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >60 min</text><text font-size="13" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="374" y="226.0">Un solo file HTML,</tspan><tspan x="374" y="242.0">piccoli passi</tspan></text><path d="M492,130 h196 l26,64 l-26,64 h-196 l26,-64z" fill="#fdeef0" stroke="#153a52" stroke-width="2.5"/><text x="608" y="176" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Test</text><text x="608" y="202" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >35 min</text><text font-size="13" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="608" y="226.0">Matrice con valori</tspan><tspan x="608" y="242.0">attesi: kcal e kJ</tspan></text><path d="M726,130 h196 l26,64 l-26,64 h-196 l26,-64z" fill="#fff6e6" stroke="#153a52" stroke-width="2.5"/><text x="842" y="176" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Correzione</text><text x="842" y="202" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >35 min</text><text font-size="13" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="842" y="226.0">Prompt di verifica,</tspan><tspan x="842" y="242.0">test ripetuti</tspan></text><path d="M960,130 h196 l26,64 l-26,64 h-196 l26,-64z" fill="#eef0ff" stroke="#153a52" stroke-width="2.5"/><text x="1076" y="176" font-size="20" font-weight="800" fill="#153a52" text-anchor="middle" >Microattività</text><text x="1076" y="202" font-size="15" font-weight="700" fill="#087f78" text-anchor="middle" >25 min</text><text font-size="13" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="1076" y="226.0">Prevedi, osserva,</tspan><tspan x="1076" y="242.0">spiega</tspan></text><path d="M820,290 C820,340 560,340 560,290" fill="none" stroke="#e0674a" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ar3)"/><text x="690" y="362" font-size="15" font-weight="700" fill="#e0674a" text-anchor="middle" >se un test fallisce: si corregge e si ripetono TUTTI i test</text><rect x="24" y="390" width="560" height="110" rx="16" fill="#e3f4f1" stroke="#087f78" stroke-width="2"/><text font-size="16" font-weight="400" fill="#173447" text-anchor="start"><tspan x="44" y="420.0"><tspan font-weight="700">Regola dei 60 minuti</tspan></tspan><tspan x="44" y="443.0">Se dopo un'ora il prototipo non funziona, si passa</tspan><tspan x="44" y="466.0">al FoodLab dimostrativo: test e didattica non si saltano.</tspan></text><rect x="616" y="390" width="560" height="110" rx="16" fill="#fff6e6" stroke="#f2a33d" stroke-width="2"/><text font-size="16" font-weight="400" fill="#173447" text-anchor="start"><tspan x="636" y="420.0"><tspan font-weight="700">Chi calcola?</tspan></tspan><tspan x="636" y="443.0">L'IA aiuta a scrivere il codice; il calcolo è una formula</tspan><tspan x="636" y="466.0">deterministica, uguale a ogni esecuzione.</tspan></text></svg>