<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Il mistero delle 16 kcal</title><desc id="d">Fumetto in tre vignette: Bitto accusa l'etichetta di essere sbagliata; la Prof ricorda che l'allegato XIV conta le fibre a 2 kcal/g; Bitto ricalcola e si scusa.</desc><rect width="1200" height="500" rx="18" fill="#ffffff"/><rect x="0" y="0" width="1200" height="54" rx="18" fill="#153a52"/><rect x="0" y="36" width="1200" height="18" fill="#153a52"/><text x="24" y="36" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start" >Il mistero delle 16 kcal</text><text x="1176" y="36" font-size="15" font-weight="600" fill="#a2f1df" text-anchor="end" >Dal Byte al Bite</text><g><rect x="15" y="66" width="380" height="388" rx="12" fill="#f1f8f7" stroke="#153a52" stroke-width="3"/><rect x="15" y="400" width="380" height="54" rx="0" fill="#d6ebe8" opacity=".7"/><rect x="15" y="66" width="380" height="388" rx="12" fill="none" stroke="#153a52" stroke-width="3"/><g transform="translate(135,440) scale(0.95,0.95)" stroke="#153a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="10" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="-34" y="-8" width="30" height="10" rx="5" fill="#153a52"/><rect x="4" y="-8" width="30" height="10" rx="5" fill="#153a52"/><path d="M-40,-96 Q-70,-120 -78,-150" fill="none" stroke-width="9" stroke="#153a52"/><path d="M40,-96 Q70,-120 78,-150" fill="none" stroke-width="9" stroke="#153a52"/><circle cx="-78" cy="-150" r="8" fill="#9fc9c4"/><circle cx="78" cy="-150" r="8" fill="#9fc9c4"/><rect x="-42" y="-108" width="84" height="74" rx="18" fill="#087f78"/><circle cx="0" cy="-72" r="13" fill="#f2a33d"/><text x="0" y="-66" font-size="15" font-weight="800" fill="#153a52" stroke="none" text-anchor="middle">B</text><line x1="0" y1="-196" x2="0" y2="-216"/><circle cx="0" cy="-222" r="7" fill="#f2a33d"/><rect x="-66" y="-170" width="12" height="28" rx="4" fill="#9fc9c4"/><rect x="54" y="-170" width="12" height="28" rx="4" fill="#9fc9c4"/><rect x="-56" y="-198" width="112" height="86" rx="24" fill="#e8f6f4"/><rect x="-44" y="-186" width="88" height="60" rx="15" fill="#153a52" stroke="none"/><circle cx="-20" cy="-160" r="8" fill="none" stroke="#7ff0dc" stroke-width="3"/><circle cx="20" cy="-160" r="8" fill="none" stroke="#7ff0dc" stroke-width="3"/><ellipse cx="0" cy="-139" rx="6" ry="7" fill="none" stroke="#7ff0dc" stroke-width="3"/></g><g transform="translate(243,300) rotate(0)"><rect x="0" y="0" width="120" height="70" rx="4" fill="#fff" stroke="#153a52" stroke-width="2.5"/><text x="8" y="18" font-size="12" font-weight="700" fill="#153a52" text-anchor="start" >Valori nutrizionali</text><line x1="6" y1="24" x2="114" y2="24" stroke="#9fb3b8" stroke-width="1"/><text x="8" y="38" font-size="12" font-weight="400" fill="#173447" text-anchor="start" >Energia</text><text x="112" y="38" font-size="12" font-weight="700" fill="#173447" text-anchor="end" >432 kcal</text><line x1="6" y1="44" x2="114" y2="44" stroke="#9fb3b8" stroke-width="1"/><text x="8" y="58" font-size="12" font-weight="400" fill="#173447" text-anchor="start" >Fibre</text><text x="112" y="58" font-size="12" font-weight="700" fill="#173447" text-anchor="end" >8 g</text></g><path d="M123,185.28 L135,206 L149,185.28" fill="#ffffff" stroke="#153a52" stroke-width="2.5" stroke-linejoin="round"/><rect x="39" y="100" width="330" height="87" rx="16" fill="#ffffff" stroke="#153a52" stroke-width="2.5"/><path d="M125,185.28 L147,185.28" stroke="#ffffff" stroke-width="5"/><text font-size="17" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="204.0" y="129.0">4×66 + 4×11 + 9×12 = 416</tspan><tspan x="204.0" y="150.8">kcal. L'etichetta dice 432:</tspan><tspan x="204.0" y="172.5">è SBAGLIATA!</tspan></text><text x="29" y="92" font-size="16" font-weight="800" fill="#087f78" text-anchor="start" >1</text></g><g><rect x="410" y="66" width="380" height="388" rx="12" fill="#f1f8f7" stroke="#153a52" stroke-width="3"/><rect x="410" y="400" width="380" height="54" rx="0" fill="#d6ebe8" opacity=".7"/><rect x="410" y="66" width="380" height="388" rx="12" fill="none" stroke="#153a52" stroke-width="3"/><g transform="translate(550,440) scale(0.88,0.88)" stroke="#153a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="-22" y="-62" width="17" height="58" rx="6" fill="#153a52"/><rect x="5" y="-62" width="17" height="58" rx="6" fill="#153a52"/><ellipse cx="-14" cy="-3" rx="16" ry="6" fill="#3b2a20"/><ellipse cx="14" cy="-3" rx="16" ry="6" fill="#3b2a20"/><path d="M-44,-58 L-36,-150 Q0,-166 36,-150 L44,-58 Z" fill="#ffffff"/><path d="M-16,-152 L0,-120 L16,-152" fill="#14978d"/><line x1="0" y1="-120" x2="0" y2="-60"/><rect x="12" y="-112" width="16" height="12" rx="2" fill="#f2a33d" stroke-width="2"/><path d="M-36,-146 Q-56,-110 -52,-80" fill="none" stroke="#153a52" stroke-width="13"/><path d="M-36,-146 Q-56,-110 -52,-80" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M36,-146 Q70,-160 96,-176" fill="none" stroke="#153a52" stroke-width="13"/><path d="M36,-146 Q70,-160 96,-176" fill="none" stroke="#ffffff" stroke-width="7"/><circle cx="-52" cy="-80" r="8" fill="#f2c8a2"/><circle cx="96" cy="-176" r="8" fill="#f2c8a2"/><rect x="-8" y="-170" width="16" height="16" fill="#f2c8a2"/><circle cx="0" cy="-196" r="32" fill="#f2c8a2"/><path d="M-32,-200 Q-30,-236 0,-232 Q30,-236 32,-200 Q22,-222 0,-220 Q-22,-222 -32,-200Z" fill="#5b3a29"/><circle cx="0" cy="-238" r="12" fill="#5b3a29"/><circle cx="-13" cy="-196" r="10" fill="#ffffff" fill-opacity=".35" stroke-width="2.5"/><circle cx="13" cy="-196" r="10" fill="#ffffff" fill-opacity=".35" stroke-width="2.5"/><line x1="-3" y1="-196" x2="3" y2="-196" stroke-width="2.5"/><circle cx="-13" cy="-195" r="2.8" fill="#153a52"/><circle cx="13" cy="-195" r="2.8" fill="#153a52"/><path d="M-10,-178 q10,9 20,0" fill="none" stroke-width="2.5"/></g><g transform="translate(678,372) rotate(-4)"><rect x="-101.28" y="-16" width="202.56" height="32" rx="6" fill="#e0f3ee" stroke="#153a52" stroke-width="2.5"/><text x="0" y="6" font-size="12" font-weight="800" fill="#153a52" text-anchor="middle" >All. XIV: fibre 2 kcal/g</text></g><path d="M538,185.28 L550,212 L564,185.28" fill="#ffffff" stroke="#153a52" stroke-width="2.5" stroke-linejoin="round"/><rect x="434" y="100" width="330" height="87" rx="16" fill="#ffffff" stroke="#153a52" stroke-width="2.5"/><path d="M540,185.28 L562,185.28" stroke="#ffffff" stroke-width="5"/><text font-size="17" font-weight="400" fill="#173447" text-anchor="middle"><tspan x="599.0" y="129.0">Calma. Il Regolamento UE</tspan><tspan x="599.0" y="150.8">conta anche le fibre: 2</tspan><tspan x="599.0" y="172.5">kcal per grammo.</tspan></text><text x="424" y="92" font-size="16" font-weight="800" fill="#087f78" text-anchor="start" >2</text></g><g><rect x="805" y="66" width="380" height="388" rx="12" fill="#f1f8f7" stroke="#153a52" stroke-width="3"/><rect x="805" y="400" width="380" height="54" rx="0" fill="#d6ebe8" opacity=".7"/><rect x="805" y="66" width="380" height="388" rx="12" fill="none" stroke="#153a52" stroke-width="3"/><g transform="translate(1055,440) scale(0.95,0.95)" stroke="#153a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="-26" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="10" y="-38" width="16" height="34" rx="5" fill="#9fc9c4"/><rect x="-34" y="-8" width="30" height="10" rx="5" fill="#153a52"/><rect x="4" y="-8" width="30" height="10" rx="5" fill="#153a52"/><path d="M-40,-96 Q-62,-70 -58,-46" fill="none" stroke-width="9" stroke="#153a52"/><path d="M40,-96 Q62,-70 58,-46" fill="none" stroke-width="9" stroke="#153a52"/><circle cx="-58" cy="-46" r="8" fill="#9fc9c4"/><circle cx="58" cy="-46" r="8" fill="#9fc9c4"/><rect x