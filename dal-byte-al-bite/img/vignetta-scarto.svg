span></text><text x="819" y="92" font-size="16" font-weight="800" fill="#087f78" text-anchor="start" >3</text></g><text x="600.0" y="486" font-size="17" font-weight="600" fill="#087f78" text-anchor="middle" >Lo scarto non è un errore dell'etichetta: è un limite del modello 4–4–9.</text></svg>