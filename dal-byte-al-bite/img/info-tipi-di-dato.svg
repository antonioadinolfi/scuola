<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t d" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"><title id="t">Da dove viene questo numero?</title><desc id="d">Infografica: un dato può essere letto dalla fonte, calcolato con una formula esplicita o generato dall'IA; un dato assente va dichiarato non disponibile e non sostituito con zero.</desc><rect width="1200" height="570" rx="18" fill="#ffffff"/><rect width="1200" height="96" rx="18" fill="#153a52"/><rect y="70" width="1200" height="26" fill="#153a52"/><text x="32" y="46" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start" >Da dove viene questo numero?</text><text x="32" y="78" font-size="16" font-weight="400" fill="#bfe9e3" text-anchor="start" >Tre provenienze da distinguere sempre, in ogni scheda e in ogni risposta dell'IA</text><rect x="32" y="122" width="360" height="330" rx="16" fill="#e3f4f1" stroke="#087f78" stroke-width="2"/><circle cx="88" cy="176" r="36" fill="#ffffff" stroke="#087f78" stroke-width="3"/><g stroke="#087f78" stroke-width="4" fill="none"><path d="M62,176 Q88,152 114,176 Q88,200 62,176Z"/><circle cx="88" cy="176" r="8" fill="#087f78"/></g><text x="140" y="172" font-size="26" font-weight="800" fill="#087f78" text-anchor="start" >LETTO</text><text x="140" y="198" font-size="16" font-weight="600" fill="#173447" text-anchor="start" >dalla fonte</text><circle cx="68" cy="256" r="6" fill="#087f78"/><text x="86" y="262" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Etichetta originale</text><circle cx="68" cy="292" r="6" fill="#087f78"/><text x="86" y="298" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Tabelle CREA</text><circle cx="68" cy="328" r="6" fill="#087f78"/><text x="86" y="334" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Norma, documento EFSA</text><rect x="52" y="380" width="320" height="52" rx="10" fill="#ffffff" stroke="#087f78" stroke-dasharray="6 4"/><text font-size="14" font-weight="600" fill="#087f78" text-anchor="middle"><tspan x="212" y="402.0">Es.: Fibre 8,0 g / 100 g</tspan></text><rect x="416" y="122" width="360" height="330" rx="16" fill="#e5f0f8" stroke="#347ca9" stroke-width="2"/><circle cx="472" cy="176" r="36" fill="#ffffff" stroke="#347ca9" stroke-width="3"/><g stroke="#347ca9" stroke-width="4" fill="none"><rect x="452" y="150" width="40" height="52" rx="6"/><rect x="460" y="158" width="24" height="10"/></g><circle cx="462" cy="182" r="3" fill="#347ca9"/><circle cx="462" cy="192" r="3" fill="#347ca9"/><circle cx="472" cy="182" r="3" fill="#347ca9"/><circle cx="472" cy="192" r="3" fill="#347ca9"/><circle cx="482" cy="182" r="3" fill="#347ca9"/><circle cx="482" cy="192" r="3" fill="#347ca9"/><text x="524" y="172" font-size="26" font-weight="800" fill="#347ca9" text-anchor="start" >CALCOLATO</text><text x="524" y="198" font-size="16" font-weight="600" fill="#173447" text-anchor="start" >con formula esplicita</text><circle cx="452" cy="256" r="6" fill="#347ca9"/><text x="470" y="262" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Formula dichiarata</text><circle cx="452" cy="292" r="6" fill="#347ca9"/><text x="470" y="298" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Passaggi ripetibili</text><circle cx="452" cy="328" r="6" fill="#347ca9"/><text x="470" y="334" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Unità controllate</text><rect x="436" y="380" width="320" height="52" rx="10" fill="#ffffff" stroke="#347ca9" stroke-dasharray="6 4"/><text font-size="14" font-weight="600" fill="#347ca9" text-anchor="middle"><tspan x="596" y="402.0">Es.: 4×66 + 4×11 + 9×12 + 2×8 =</tspan><tspan x="596" y="420.0">432 kcal</tspan></text><rect x="800" y="122" width="360" height="330" rx="16" fill="#fff6e6" stroke="#c47a12" stroke-width="2"/><circle cx="856" cy="176" r="36" fill="#ffffff" stroke="#c47a12" stroke-width="3"/><path d="M856,148 L863,169 L884,176 L863,183 L856,204 L849,183 L828,176 L849,169Z" fill="#c47a12"/><text x="908" y="172" font-size="26" font-weight="800" fill="#c47a12" text-anchor="start" >GENERATO</text><text x="908" y="198" font-size="16" font-weight="600" fill="#173447" text-anchor="start" >dall'IA</text><circle cx="836" cy="256" r="6" fill="#c47a12"/><text x="854" y="262" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Testo, stima, sintesi</text><circle cx="836" cy="292" r="6" fill="#c47a12"/><text x="854" y="298" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Plausibile ≠ vero</text><circle cx="836" cy="328" r="6" fill="#c47a12"/><text x="854" y="334" font-size="18" font-weight="500" fill="#173447" text-anchor="start" >Va sempre verificato</text><rect x="820" y="380" width="320" height="52" rx="10" fill="#ffffff" stroke="#c47a12" stroke-dasharray="6 4"/><text font-size="14" font-weight="600" fill="#c47a12" text-anchor="middle"><tspan x="980" y="402.0">Es.: «Il prodotto è ricco di</tspan><tspan x="980" y="420.0">fibre…»</tspan></text><rect x="32" y="474" width="1136" height="70" rx="14" fill="#e0674a"/><text x="600" y="506" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >Quarta categoria: NON DISPONIBILE</text><text x="600" y="532" font-size="17" font-weight="500" fill="#ffffff" text-anchor="middle" >Un dato assente si dichiara: non si sostituisce con zero e non si inventa.</text></svg>