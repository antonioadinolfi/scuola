name: Vibe Coding portal API
on:
  push:
    paths:
      - "corso-vibe-coding/backend/**"
  pull_request:
    paths:
      - "corso-vibe-coding/backend/**"
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corso-vibe-coding/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check server.js
