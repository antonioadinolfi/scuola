name: Aggiornamento automatico agenda

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 pypdf icalendar recurring-ical-events

      - name: Esegui agente agenda
        env:
          # Secret GitHub: uno o più indirizzi segreti Google Calendar in formato iCal,
          # separati da newline o punto e virgola.
          GOOGLE_CALENDAR_ICAL_URLS: ${{ secrets.GOOGLE_CALENDAR_ICAL_URLS }}
          GOOGLE_CALENDAR_DAYS_BACK: "30"
          GOOGLE_CALENDAR_DAYS_FORWARD: "365"
        run: python agenda-semplice/agent.py

      - name: Salva aggiornamenti
        run: |
          git config user.name "agenda-agent[bot]"
          git config user.email "agenda-agent[bot]@users.noreply.github.com"
          git add agenda-semplice/agenda-agent.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento."
          else
            git commit -m "Agenda agent: sincronizzazione automatica"
            git push
          fi
